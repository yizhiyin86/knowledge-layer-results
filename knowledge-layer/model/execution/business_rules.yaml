# Business knowledge that is NOT in either warehouse: it lives in process documentation, the MES standard
# times, the contract-management system and operating procedures. The KL brings it in so agents can use it.

business_rules:
  - id: BR-CUST-01
    name: What "customer" means
    owner: Commercial Analytics
    concepts: [Account, Wholesaler]
    text: "In commercial and customer-exposure questions, a customer is the top-level contracted account: the health system (IDN) for affiliated clinics, or the clinic itself if independent. Roll clinics up with CORE.ACCOUNT.PARENT_ACCOUNT_ID. In distribution questions, the customer is the wholesaler (trade customer). Prescribers and clinics are not customers on their own."
  - id: BR-ALLOC-01
    name: Shortage allocation
    owner: Supply Planning
    concepts: [DistributionCenter, Account]
    text: "When a DC cannot cover demand, allocate available units in this order: (1) health systems with a Tier A supply contract, (2) Tier B contracts, (3) all other accounts pro rata by their last-13-week TRx. Clinics inherit their health system's contract tier. No transfers between DCs without Supply Planning approval. Before offering a substitute, check BR-SUB-01 and confirm the substitute is not fed by the same failing supply chain."
  - id: BR-REGION-01
    name: DC service regions
    owner: Supply Planning
    concepts: [DistributionCenter, Account]
    text: "Accounts are served by the DC for the account's state (see reference set dc_service_regions)."
  - id: BR-SUB-01
    name: Approved substitutes during shortage
    owner: Commercial Analytics
    concepts: [MedicinalProduct, PackagedProduct]
    text: "During a Lacrivia shortage the approved company substitute is Cyclosporine OS 0.05%, unless it is constrained by the same supply issue; then there is no approved company substitute and Medical Affairs guides therapeutic alternatives. Oculon has no approved company substitute."
  - id: BR-LEAD-01
    name: Recovery lead time
    owner: Supply Planning
    concepts: [Material, Plant, PurchaseOrder]
    text: "Supply recovers at the DC only after every downstream stage completes: supplier transit, make and QC at each BOM level, QC release of the finished good (incl. 14-day sterility test for ophthalmics) and DC transit. Use get_lead_times for the stage durations (MES standard times)."
  - id: BR-SUB-02
    name: Substitution order during a pack shortage
    owner: Supply Planning
    concepts: [PackagedProduct, MedicinalProduct, DistributionCenter]
    text: "When a pack is short at a DC, offer customers, in this order: (1) another pack of the same brand that is at or above safety stock at that DC, (2) the approved company substitute (BR-SUB-01) if it is not fed by the failing material and is at or above safety stock, (3) otherwise no company substitute; Medical Affairs guides therapeutic alternatives."
  - id: BR-ALLOC-02
    name: Allocation mechanics
    owner: Supply Planning
    concepts: [DistributionCenter, Account]
    text: "Allocate only packs whose supply the disruption interrupts (no qualified, available alternate supplier covers the plant that makes them), and only at DCs where such a pack is below safety stock in the latest inventory snapshot; allocate that pack's on-hand units. Go tier by tier (BR-ALLOC-01). Within a tier, split pro rata by each account's last-13-week TRx of that NDC from prescribers in the DC's service states (BR-REGION-01), rolled up to the contracted account (BR-CUST-01); round down and give the remaining units to the largest account. An account gets at most its 13-week TRx of that NDC; units left after a tier go to the next tier. Accounts with no TRx of that NDC get nothing."
  - id: BR-APPR-01
    name: Allocation approval threshold
    owner: Supply Planning
    concepts: [DistributionCenter, Account]
    text: "An allocation plan (everything allocated at one DC for one disruption, all packs together) needs Supply Planning lead approval before it is recorded if its total value at list price is $25,000 or more, or if it moves stock between DCs. Request one approval for the plan and record its approval id on every allocation of the plan."

